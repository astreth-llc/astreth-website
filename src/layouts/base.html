<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.full_title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="robots" content="{{ page.robots }}">
<link rel="canonical" href="{{ page.canonical }}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:type" content="{{ page.og_type }}">
<meta property="og:title" content="{{ page.og_title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ page.canonical }}">
<meta property="og:image" content="{{ page.share_image }}">
<meta property="og:image:alt" content="{{ page.share_image_alt }}">
{% if page.date_iso %}<meta property="article:published_time" content="{{ page.date_iso }}">
{% endif %}<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#161313">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="alternate" type="application/rss+xml" title="Astreth Blog" href="/blog/rss.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,700;1,400;1,700&family=Urbanist:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="/assets/css/site.css?v={{ build_id }}">
<script>document.documentElement.classList.add('js');</script>
{{{ analytics_head }}}
</head>
<body class="{{ page.body_class }}">
<a class="skip-link" href="#main">Skip to content</a>
{% include "header" %}
<main id="main" tabindex="-1">
{{{ content }}}
</main>
{% include "footer" %}
<script src="/assets/js/site.js?v={{ build_id }}" defer></script>
{{{ userway }}}
</body>
</html>
